# Имя процесса, которое будет отображаться в Actions
name: Deploy Docs to GitHub Pages

on:
  # Запускать при пуше в вашу рабочую ветку
  push:
    branches: ["feature/subscription-model"]
  
  # Позволяет запускать вручную со страницы Actions
  workflow_dispatch:

# Права доступа
permissions:
  contents: read
  pages: write
  id-token: write

# Настройки параллельного выполнения
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Задача развертывания
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          # Указываем, что Gemfile лежит в папке docs
          working-directory: './docs' # <-- ВАЖНОЕ ДОПОЛНЕНИЕ
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        # Собираем сайт, указывая, где лежат его исходники
        run: |
          cd docs
          bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Загружаем собранный сайт из папки _site внутри docs
          path: './docs/_site' # <-- ВАЖНОЕ ИЗМЕНЕНИЕ
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4