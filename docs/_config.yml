# Основная тема для сайта документации
theme: just-the-docs

# Название сайта, которое будет отображаться в шапке
title: MyGemini Zero | Руководство

# Описание для поисковых систем
description: Полное руководство по настройке и использованию приватного ИИ-ассистента MyGemini Zero в Telegram.

# URL вашего сайта. Это КРАЙНЕ ВАЖНО для корректной работы ссылок и стилей.
url: "https://kobaltgit.github.io/MyGemini_Zero/"

# Цветовая схема (dark, light или auto)
color_scheme: dark

# Включаем встроенную функцию поиска по сайту
search_enabled: true

search:
  # Split pages into sections that can be searched individually
  # Supports 1 - 6, default: 2
  heading_level: 2
  # Maximum amount of previews per search result
  # Default: 3
  previews: 3
  # Maximum amount of words to display before a matched word in the preview
  # Default: 5
  preview_words_before: 5
  # Maximum amount of words to display after a matched word in the preview
  # Default: 10
  preview_words_after: 10
  # Set the search token separator
  # Default: /[\s\-/]+/
  # Example: enable support for hyphenated search words
  tokenizer_separator: /[\s/]+/
  # Display the relative url in search results
  # Supports true (default) or false
  rel_url: true
  # Enable or disable the search button that appears in the bottom right corner of every page
  # Supports true or false (default)
  button: false
  # Focus the search input by pressing `ctrl + focus_shortcut_key` (or `cmd + focus_shortcut_key` on macOS)
  focus_shortcut_key: 'k'

# Добавляем полезные ссылки в шапку сайта
aux_links:
  "Репозиторий на GitHub":
    - "https://github.com/kobaltgit/MyGemini_Zero"
  "Telegram-бот MyGemini Zero":
    - "https://t.me/mgemz_bot"

# Настройка текста в футере (подвале) сайта
footer_content: "Copyright &copy; 2025 kobaltgit. Распространяется под лицензией <a href=\"https://www.gnu.org/licenses/agpl-3.0.html\">AGPL-3.0</a>."

# Включаем Jekyll SEO Tag плагин для лучшей оптимизации
plugins:
  - jekyll-seo-tag