# Включаем Jekyll SEO Tag плагин для лучшей оптимизации
plugins:
  - jekyll-seo-tag
  # - jekyll-github-metadata
  - jekyll-include-cache
  - jekyll-sitemap

kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

